[package]
name = "wibu-cli"
version = "1.1.0"
edition = "2021"
authors = ["panz-08"]
description = "Streaming anime subtitle Indonesia langsung dari terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Panz-08/wibu-cli"
homepage = "https://github.com/Panz-08/wibu-cli"
keywords = ["anime", "cli", "streaming", "mpv", "indonesia"]
categories = ["command-line-utilities"]

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.79"
async-trait = "0.1.77"
base64 = "0.21.7"
clearscreen = "2.0.1"
colored = "2.1.0"
dialoguer = { version = "0.11.0", features = ["fuzzy-select"] }
html-escape = "0.2.13"
image = "0.24.8"
once_cell = "1.19.0"
open = "5.0.1"
regex = "1.10.3"
reqwest = { version = "0.11.24", features = ["json", "gzip"] }
serde_json = "1.0.113"
tokio = { version = "1.36.0", features = ["rt-multi-thread", "time"] }
unicode-width = "0.1.11"
viuer = "0.7.1"
